<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hutano – Clinic System</title>
<meta name="description" content="Hutano runs the whole clinic visit in one system: fingerprint check-in, patient chart, pharmacy, payroll, accounts and a patient app.">
<meta property="og:title" content="Hutano – Clinic System">
<meta property="og:description" content="One system for the whole visit, from fingerprint to payment.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0A1110">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A1110'/%3E%3Cpath d='M8 34h12l6-14 10 26 6-12h14' fill='none' stroke='%233DDC97' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#0A1110; --surface:#101A18; --raised:#152320; --line:#223631; --ink:#D6E6DF; --muted:#7D978D;
  --accent:#3DDC97; --accent-ink:#06120D; --amber:#F2B84B; --red:#FF6B6B; --blue:#5CC8FF;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--mono);font-weight:600;line-height:1.25;margin:0}
h2{font-size:1.3rem}
h3{font-size:.98rem;color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mono{font-family:var(--mono)}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;padding:.7rem 1.1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.logo{font-family:var(--mono);font-weight:700;font-size:1.1rem;display:flex;align-items:center;gap:.5rem}
.logo i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.logo small{color:var(--muted);font-weight:400;font-size:.8rem}
.seg{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:transparent;border:0;padding:.38rem .8rem;cursor:pointer;color:var(--muted);font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
nav{max-width:1200px;margin:0 auto;padding:0 1.1rem;display:flex;gap:.1rem;overflow-x:auto}
nav a{color:var(--muted);text-decoration:none;padding:.5rem .75rem;border-bottom:2px solid transparent;white-space:nowrap;font-size:.92rem}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main{max-width:1200px;margin:0 auto;padding:1.3rem 1.1rem 4rem}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.sub{color:var(--muted);max-width:68ch;margin:.25rem 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:1rem 1.1rem;margin-bottom:1rem}
.grid{display:grid;gap:1rem}
@media(min-width:900px){.g2{grid-template-columns:1fr 1fr}.g32{grid-template-columns:3fr 2fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:1rem}
.kpi{background:var(--surface);padding:.8rem 1rem}
.kpi b{display:block;font-family:var(--mono);font-size:1.5rem;color:var(--ink)}
.kpi span{color:var(--muted);font-size:.84rem}

/* patient flow board: the signature element */
.flow{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:.5rem;overflow-x:auto;padding-bottom:.4rem}
.col{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:.55rem;min-height:180px}
.col h4{margin:0 0 .5rem;font-family:var(--mono);font-size:.78rem;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:.5rem .55rem;margin-bottom:.45rem;font-size:.85rem}
.card.slow{border-left-color:var(--amber)}
.card.late{border-left-color:var(--red)}
.card b{display:block}
.card .t{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.card .acts{display:flex;gap:.3rem;margin-top:.4rem}

.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-weight:500;color:var(--muted);padding:.45rem .5rem;border-bottom:1px solid var(--line);font-size:.82rem;white-space:nowrap}
td{padding:.5rem;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--mono)}

.tag{display:inline-block;padding:.08rem .5rem;border-radius:4px;font-size:.76rem;font-family:var(--mono);background:var(--raised);border:1px solid var(--line);color:var(--muted)}
.tag.ok{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.tag.warn{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 40%,transparent)}
.tag.bad{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.tag.info{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 40%,transparent)}

label.f{display:block;font-size:.82rem;color:var(--muted);margin:.7rem 0 .25rem}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:.5rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
textarea{min-height:80px;resize:vertical}
.row{display:grid;gap:.7rem}
@media(min-width:620px){.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:repeat(3,1fr)}.r4{grid-template-columns:repeat(4,1fr)}}
.btn{border:1px solid var(--accent);border-radius:6px;padding:.45rem .9rem;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:.9rem}
.btn.g{background:transparent;color:var(--accent)}
.btn.s{padding:.22rem .55rem;font-size:.78rem}
.btn.amber{background:var(--amber);border-color:var(--amber)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.9rem}
.muted{color:var(--muted)} .small{font-size:.84rem}
.list{list-style:none;margin:0;padding:0}
.list li{padding:.6rem 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.spread{display:flex;justify-content:space-between;gap:.8rem;align-items:flex-start;flex-wrap:wrap}
.empty{color:var(--muted);padding:.8rem 0}
.bars .b{display:grid;grid-template-columns:150px 1fr 3rem;gap:.6rem;align-items:center;margin:.35rem 0;font-size:.86rem}
.bars .tr{height:10px;background:var(--raised);border-radius:3px;overflow:hidden}
.bars .fl{height:100%;background:var(--accent)}
.bars.amber .fl{background:var(--amber)}
.bars.blue .fl{background:var(--blue)}
.bars b{font-family:var(--mono);text-align:right;font-weight:400}

.scan{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap}
.fp{position:relative;width:110px;height:130px;border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden;flex:none}
.fp svg{position:absolute;inset:12px 15px;width:80px;height:106px;color:var(--muted)}
.fp .ln{position:absolute;left:0;right:0;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent);top:0;opacity:0}
.fp.on .ln{opacity:1;animation:sweep 1.1s ease-in-out 2}
.fp.done svg{color:var(--accent)}
@keyframes sweep{0%{top:4%}50%{top:94%}100%{top:4%}}
.chart-h{display:flex;gap:1rem;flex-wrap:wrap;align-items:center;padding:.8rem 1rem;background:var(--raised);border:1px solid var(--line);border-radius:9px;margin-bottom:1rem}
.chart-h .who{font-family:var(--mono);font-weight:700;font-size:1.05rem}
.timeline{display:flex;gap:0;flex-wrap:wrap;font-family:var(--mono);font-size:.76rem}
.timeline span{padding:.2rem .5rem;border:1px solid var(--line);margin:-1px 0 0 -1px;color:var(--muted)}
.timeline span.done{color:var(--accent)}
.timeline span.now{background:var(--accent);color:var(--accent-ink)}
.qr{background:#fff;padding:8px;border-radius:6px;display:inline-block;line-height:0}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:.55rem 1rem;border-radius:7px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.note{border-left:2px solid var(--amber);padding:.4rem .8rem;background:var(--raised);border-radius:0 6px 6px 0;font-size:.87rem}
.pill-row{display:flex;flex-wrap:wrap;gap:.35rem}
.pill-row label{cursor:pointer}
.pill-row input{position:absolute;opacity:0;pointer-events:none}
.pill-row span{display:inline-block;padding:.25rem .65rem;border:1px solid var(--line);border-radius:5px;font-size:.84rem}
.pill-row input:checked+span{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.pill-row input:focus-visible+span{outline:2px solid var(--amber)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.tabs button{background:transparent;border:0;padding:.36rem .8rem;cursor:pointer;color:var(--muted);font-size:.86rem}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
select.month{width:auto;min-width:160px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--raised)}
tfoot td{border-top:1px solid var(--line);font-weight:600}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:none;font-family:var(--mono);font-size:.84rem}
.callout{border-left:2px solid var(--amber);padding:.6rem .9rem;background:var(--raised);border-radius:0 6px 6px 0;font-size:.9rem;margin-bottom:1rem}
.callout b{color:var(--amber);font-family:var(--mono)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:.4rem 1rem;font-size:.9rem}
.dl dt{color:var(--muted)} .dl dd{margin:0}
.avatar{width:34px;height:34px;border-radius:7px;background:var(--raised);border:1px solid var(--line);display:inline-grid;place-items:center;font-family:var(--mono);font-weight:700;color:var(--accent);flex:none;font-size:.85rem}
.person{display:flex;gap:.7rem;align-items:center}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-family:var(--mono);font-size:11px}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:.5rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:.35rem;vertical-align:-1px}
.journey{list-style:none;margin:0;padding:0}
.journey li{position:relative;padding:0 0 1.15rem 2rem}
.journey li::before{content:"";position:absolute;left:6px;top:18px;bottom:-2px;width:2px;background:color-mix(in srgb,var(--accent) 35%,var(--line))}
.journey li:last-child{padding-bottom:0}
.journey li:last-child::before{display:none}
.journey .dot{position:absolute;left:0;top:5px;width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.journey li.todo .dot{background:var(--raised);border:2px solid var(--line);box-shadow:none}
.journey li.todo::before{background:var(--line)}
.journey .jt{display:flex;justify-content:space-between;gap:1rem;align-items:baseline}
.journey .jt b{font-family:var(--mono);font-weight:600;font-size:.9rem}
.journey .jt time{font-family:var(--mono);font-size:.8rem;color:var(--accent)}
.journey li.todo .jt time{color:var(--muted)}
.journey .jb{color:var(--muted);font-size:.88rem;margin-top:.2rem}
.journey .jb strong{color:var(--ink);font-weight:500}
.big{font-family:var(--mono);font-size:2rem;font-weight:700}
.monthbar{display:flex;gap:.35rem;align-items:center}
.monthbar select{min-width:150px}
.flexgap{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;min-width:1.2rem;padding:0 .35rem;margin-left:.35rem;border-radius:99px;background:var(--amber);color:var(--accent-ink);font-family:var(--mono);font-size:.72rem;font-weight:700;text-align:center;line-height:1.2rem}
nav .navright{margin-left:auto;font-size:.82rem}
tr.tot td{font-weight:600;border-top:1px solid var(--line)}
.login{max-width:440px;margin:2.5rem auto 0}
.login .panel{padding:1.6rem 1.5rem}
.login h2{margin-top:1rem}
.stepline{display:flex;flex-wrap:wrap;margin:1.1rem 0 .4rem;font-family:var(--mono);font-size:.74rem;justify-content:center}
.stepline span{padding:.22rem .55rem;border:1px solid var(--line);margin:-1px 0 0 -1px;color:var(--muted)}
.stepline span.done{color:var(--accent)}
.stepline span.now{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.vitals div{background:var(--raised);padding:.7rem .85rem}
.vitals span{display:block;color:var(--muted);font-size:.78rem}
.vitals b{font-family:var(--mono);font-size:1.25rem}
.chat{display:flex;flex-direction:column;gap:.55rem;max-height:340px;overflow-y:auto}
.bubble{max-width:85%;padding:.55rem .75rem;border-radius:10px;font-size:.9rem}
.bubble time{display:block;font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-top:.25rem}
.bubble.me{align-self:flex-end;background:color-mix(in srgb,var(--accent) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.bubble.them{align-self:flex-start;background:var(--raised);border:1px solid var(--line)}
.inbox{list-style:none;margin:0;padding:0}
.inbox li{padding:.85rem 0 .85rem .8rem;border-bottom:1px solid var(--line);border-left:2px solid transparent}
.inbox li:last-child{border-bottom:0}
.inbox li.new{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,transparent)}
.netpay{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;padding:.8rem 1rem;border:1px solid var(--accent);border-radius:8px}
.netpay b{font-family:var(--mono);font-size:1.4rem;color:var(--accent)}
a.btn{text-decoration:none;display:inline-block}
@media print{header,nav,.tabs,.monthbar,.actions,.btn,.link,#toast{display:none!important}body{background:#fff;color:#000}.panel,.kpi{background:#fff;border-color:#bbb}}
nav .navsep{width:1px;background:var(--line);margin:.45rem .35rem;flex:none}
.hero{display:flex;gap:2rem;align-items:center;justify-content:space-between;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 10%,var(--surface)),var(--surface));border:1px solid var(--line);border-radius:12px;padding:1.6rem 1.6rem;margin-bottom:1rem}
.hero h1{font-family:var(--mono);font-size:clamp(1.25rem,3vw,1.7rem);line-height:1.25;max-width:24ch;margin:.2rem 0 .5rem}
.hero .sub{max-width:60ch}
.hero-art{color:var(--accent);flex:none;opacity:.9}
@media(max-width:700px){.hero-art{display:none}}
.eyebrow{font-family:var(--mono);font-size:.78rem;color:var(--accent);margin:0;text-transform:uppercase;letter-spacing:.08em}
.illus{color:var(--accent);flex:none}
.three{display:grid;gap:1.2rem}
@media(min-width:800px){.three{grid-template-columns:repeat(3,1fr)}}
.three b{display:block;font-family:var(--mono);margin:.5rem 0 .25rem}
.three p{color:var(--muted);font-size:.9rem;margin:0}
h2.sec{font-size:1rem;margin:1.6rem 0 .7rem}
.roles{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.role{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem;display:flex;flex-direction:column;gap:.45rem;transition:border-color .2s}
.role:hover{border-color:var(--accent)}
.role b{font-family:var(--mono)}
.role p{color:var(--muted);font-size:.86rem;margin:0;flex:1}
.visitflow{display:flex;align-items:center;gap:.3rem;overflow-x:auto;padding:.3rem 0}
.vf{display:flex;flex-direction:column;align-items:center;gap:.35rem;min-width:84px;text-align:center;font-size:.8rem;color:var(--muted)}
.vfa{color:var(--faint);font-family:var(--mono);font-size:1.2rem}
.prog{width:180px;height:8px;background:var(--raised);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.setup{list-style:none;margin:.8rem 0 0;padding:0}
.setup li{display:flex;gap:.8rem;align-items:center;padding:.7rem 0;border-top:1px solid var(--line)}
.setup li .num{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:.8rem;flex:none}
.setup li.ok .num{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.setup li div{flex:1}.setup li p{margin:0;color:var(--muted);font-size:.84rem}
.impacts{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.impact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem}
.impact b{display:block;font-family:var(--mono);margin:.4rem 0 .6rem}
.impact .ba{display:flex;align-items:center;gap:.8rem}
.impact .ba span{display:block;font-size:.74rem;color:var(--muted)}
.impact .ba em{font-style:normal;font-family:var(--mono);font-size:1.25rem;font-weight:600}
.impact .arr{color:var(--faint);font-size:1.2rem}
.impact p{color:var(--muted);font-size:.82rem;margin:.6rem 0 0}
#tour .spot{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(3,8,7,.72);outline:2px solid var(--accent);z-index:40;pointer-events:none;transition:all .25s}
#tour .spot.none{top:50%;left:50%;width:0;height:0;outline:0}
.tcard{position:fixed;z-index:41;background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:1.1rem 1.15rem 1rem;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.tcard.mobile{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.tcard h3{margin:.2rem 0 .3rem;color:var(--ink);font-size:1rem}
.tcard p{margin:0;color:var(--muted);font-size:.9rem}
.tart{width:72px;height:72px;border-radius:14px;background:var(--raised);display:grid;place-items:center;margin-bottom:.6rem}
.tstep{font-family:var(--mono);font-size:.74rem;color:var(--accent)}
.tdots{display:flex;gap:.3rem;margin-top:.8rem}.tdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.tdots i.on{background:var(--accent)}
.tarrow{position:absolute;width:14px;height:14px;background:var(--surface);border:1px solid var(--accent);transform:rotate(45deg)}
.tarrow.up{top:-8px;border-right:0;border-bottom:0}.tarrow.down{bottom:-8px;border-left:0;border-top:0}
.guide-btn{border:1px solid var(--line);background:transparent;color:var(--accent);border-radius:7px;padding:.36rem .7rem;cursor:pointer;font-family:var(--mono);font-size:.84rem}
@media (prefers-reduced-motion:reduce){#tour .spot{transition:none}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo"><i></i>hutano<small>/ Mtlanga Men’s Clinic</small></div>
    <button class="guide-btn" id="guideBtn" style="margin-left:auto">? Guide</button>
    <div class="seg" role="group" aria-label="Interface" style="margin-left:0">
      <button id="mStaff" aria-pressed="true">Clinic staff</button>
      <button id="mDoc" aria-pressed="false">Doctor</button>
      <button id="mPat" aria-pressed="false">Patient portal</button>
    </div>
  </div>
  <nav id="nav" aria-label="Sections"></nav>
</header>
<main id="main"></main>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================= reference data ================= */

function billOf(e,drugs){

  e.labs.forEach(l=>items.push({d:"Lab: "+l.test,a:(LABS[l.test]||{fee:0}).fee,k:"lab"}));

  return items;
}

  const nssa=Math.min(gross*.045,31.5), paye=Math.max(0,(gross-nssa-100)*.2), levy=paye*.03;
  return {...l,s,hours,basic,overtime,extras,gross,nssa,paye,levy,ded:nssa+paye+levy,net:gross-nssa-paye-levy};
}

function gcal(p,n){
  const d=n.date.replace(/-/g,""),t=n.time.replace(":","")+"00";
  const[h,m]=n.time.split(":").map(Number);const e=pad2(Math.floor((h*60+m+30)/60))+pad2((m+30)%60)+"00";
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("Mtlanga Men’s Clinic: "+n.reason)+"&dates="+d+"T"+t+"/"+d+"T"+e+"&details="+encodeURIComponent("Appointment for "+p.name);
}

const HIDDEN={staff:["chart"],doctor:[],patient:[]};
const NAVSEP=["pharmacy","insights"];
const VIEWS={staff:[["start","Start here"],["queue","Patient flow"],["visits","Visits"],["patients","Patients"],["pharmacy","Pharmacy"],["insights","Insights"],["payroll","Payroll"],["accounts","Accounts"]],
  doctor:[["dtoday","Today"],["dpatients","My patients"],["dlabs","Lab results"],["dmsgs","Messages"]],
  patient:[["portal","My visit"],["pmsgs","Messages"],["prx","Prescriptions"],["pappts","Appointments"]]};
function current(){const h=location.hash.slice(1);return VIEWS[mode].some(v=>v[0]===h)||HIDDEN[mode].includes(h)?h:VIEWS[mode][0][0]}
function go(v){if(location.hash==="#"+v)render();else location.hash=v}
function gate(){if(mode==="doctor"&&!ui.doc)return"dlogin";if(mode==="patient"&&!ui.portalPid)return"plogin";return null}
function navHTML(cur){if(gate())return"";
  const badge=n=>n?`<span class="badge">${n}</span>`:"";
  return VIEWS[mode].map(([k,l])=>{let b="";
    if(k==="pmsgs")b=badge(unread(ui.portalPid));
    if(k==="prx")b=badge(S.encs.filter(e=>e.pid===ui.portalPid&&e.rx.length&&!e.paid).length);
    if(k==="dmsgs")b=badge(myThreads().filter(t=>t.unread).length);
    if(k==="dlabs")b=badge(myLabs().filter(x=>x.l.result&&!x.l.reviewed).length);
    const on=k===cur||(cur==="chart"&&k==="visits");return `${NAVSEP.includes(k)&&mode==="staff"?'<span class="navsep" aria-hidden="true"></span>':""}<a href="#${k}" ${on?'aria-current="page"':""}>${l}${b}</a>`}).join("")+(mode==="doctor"?`<a href="#dtoday" id="dOut" class="navright">Sign out · ${esc(ST(ui.doc).name)}</a>`:"");}
function bindNav(){const o=document.getElementById("dOut");if(o)o.onclick=ev=>{ev.preventDefault();ui.doc=null;ui.dEnc=null;render()}}
function renderNavOnly(){document.getElementById("nav").innerHTML=navHTML(gate()||current());bindNav()}
function render(){
  const cur=gate()||current();
  document.getElementById("nav").innerHTML=navHTML(cur);bindNav();
  [["mStaff","staff"],["mDoc","doctor"],["mPat","patient"]].forEach(([id,m])=>document.getElementById(id).setAttribute("aria-pressed",mode===m));
  document.getElementById("main").innerHTML=V[cur]();
  const ms=document.getElementById("monthSel");if(ms)ms.onchange=e=>{ui.month=e.target.value;if(ui.month!=="all")ui.am=ui.month;render()};
  const am=document.getElementById("amSel");if(am)am.onchange=e=>{ui.am=ui.month=e.target.value;render()};
  document.querySelectorAll("[data-am]").forEach(b=>b.onclick=()=>{if(b.dataset.am){ui.am=ui.month=b.dataset.am;render()}});
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ui[b.dataset.tab]=b.dataset.val;if(b.dataset.tab==="accTab"){ui.debtor=null;ui.creditor=null}render()});
  document.querySelectorAll("[data-chart]").forEach(b=>{b.onclick=()=>{openEnc=b.dataset.chart;ui.editDone=false;go("chart")};if(b.tagName==="TR")b.onkeydown=e=>{if(e.key==="Enter")b.click()}});
  document.querySelectorAll("[data-pid]").forEach(b=>{b.onclick=()=>{ui.pid=b.dataset.pid;go("patients")};if(b.tagName==="TR")b.onkeydown=e=>{if(e.key==="Enter")b.click()}});
  document.querySelectorAll("[data-denc]").forEach(b=>{b.onclick=()=>{ui.dEnc=b.dataset.denc;go("dpatients")};if(b.tagName==="TR")b.onkeydown=e=>{if(e.key==="Enter")b.click()}});
  B[cur]&&B[cur]();
  bindGuide();
}

function journey(e,forPatient){
  const p=PT(e.pid),T=e.times;
  const li=(on,title,time,body)=>`<li class="${on?"":"todo"}"><span class="dot"></span><div class="jt"><b>${title}</b><time>${time||""}</time></div>${body?`<div class="jb">${body}</div>`:""}</li>`;
  const labs=e.labs.map(l=>`<strong>${esc(l.test)}</strong>: ${esc(l.result||"waiting for the lab")} ${l.flag?`<span class="tag ${l.flag==="Normal"||l.flag==="Negative"?"ok":"warn"}">${esc(l.flag)}</span>`:""}`).join("<br>");
  const rx=e.rx.map(r=>`<strong>${esc(DR(r.drug).name)}</strong> × ${r.qty}, ${esc(r.dose)}`).join("<br>");
  const nx=e.next?`<strong>${dfmt(e.next.date)} at ${esc(e.next.time)}</strong>, ${esc(e.next.reason)}<br><a class="link" href="${gcal(p,e.next)}" target="_blank" rel="noopener">${forPatient?"Add to my calendar":"Add to calendar"} ↗</a>`:"No follow-up booked";
  return `<ol class="journey">
   ${li(T.Reception,"Signed in",hm(T.Reception),forPatient?"Fingerprint confirmed at reception":`Fingerprint confirmed · ${esc(e.payer)}`)}
   ${li(T.Vitals,"Vitals taken",hm(T.Vitals),`BP <strong>${esc(e.vitals.bp||"–")}</strong> · pulse ${esc(e.vitals.pulse||"–")} · ${esc(e.vitals.temp||"–")}°C · ${esc(e.vitals.weight||"–")} kg`)}
   ${li(T.Lab,"Lab tests",hm(T.Lab),labs||"No tests")}
   ${li(T.Doctor,"Seen by "+esc(ST(e.doctor)?.name||"the doctor"),hm(T.Doctor),`<strong>Reason:</strong> ${esc(e.complaint||"–")}${e.notes&&!forPatient?"<br>"+esc(e.notes):""}`)}
   ${li(e.dx.length,"Diagnosis and advice","",e.dx.length?`<strong>${esc(e.dx.map(c=>DX[c].name).join(", "))}</strong><br>${esc(e.rec||"")}`:"Waiting for the doctor")}
   ${li(e.rx.some(r=>r.dispensed),"Medicines",hm(T.Pharmacy),rx||"No medicines")}
   ${li(e.next,"Next appointment","",nx)}
   ${li(T.Done,"Checked out",hm(T.Done),`${money(billTotal(e))} · ${e.payer==="Cash"?"cash":esc(e.payer)}`)}
  </ol>`;
}

     ${k<steps.length-1?`<button class="btn" data-cstep="${steps[k+1][0]}">Save & continue ›</button>`:`<button class="btn" id="saveChart">Save chart</button>`}

pharmacy(){

  <div class="panel wrap"><table><thead><tr><th>Medicine</th><th class="n">Received</th><th class="n">Dispensed</th><th class="n">In stock</th><th class="n">Value</th><th></th></tr></thead><tbody>

  if(ui.phTab==="receive")return head+`<div class="grid g2"><div class="panel"><h3>Receive stock from a supplier</h3>
    <div class="row r2"><div><label class="f" for="poV" style="margin-top:0">Supplier</label><select id="poV">${S.vendors.filter(v=>v.type==="Medicines").map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join("")}</select></div>

insights(){
  const done=S.encs.filter(e=>e.stage==="Done"&&inMonth(e.day));
  const head=`<div class="head"><div><h2>Insights</h2><p class="sub">What the clinic treats, how long patients wait, and whether the clinic is paying its way.</p></div><div style="display:flex;gap:.6rem;flex-wrap:wrap">${tabs("insTab",[["health","Health"],["time","Time"],["money","Money"],["impact","Impact"]])}${ui.insTab==="impact"?"":monthSelect()}</div></div>`;
  if(ui.insTab==="impact")return head+impactView();
  if(ui.insTab==="health"){
    const dxc={},drc={};done.forEach(e=>{e.dx.forEach(c=>dxc[c]=(dxc[c]||0)+1);e.rx.forEach(r=>drc[r.drug]=(drc[r.drug]||0)+r.qty)});
    const dxs=Object.entries(dxc).sort((a,b)=>b[1]-a[1]), maxD=Math.max(1,...dxs.map(x=>x[1]));
    const drs=Object.entries(drc).sort((a,b)=>b[1]-a[1]).slice(0,5), maxR=Math.max(1,...drs.map(x=>x[1]));
    const mal=months().map(m=>[m,S.encs.filter(e=>e.day.startsWith(m)&&e.dx.includes("B54")).length]).filter(x=>x[0]<"2026-06");
    const peak=mal.reduce((a,b)=>b[1]>a[1]?b:a,["",0]);
    const mp={};S.encs.filter(e=>e.dx.includes("B54")).forEach(e=>{const p=PT(e.pid).province;mp[p]=(mp[p]||0)+1});
    const topMal=Object.entries(mp).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]).join(" and ");
    return head+`${peak[1]>=3?`<div class="callout"><b>Outbreak watch: malaria.</b> <span class="muted">${mal.map(x=>`${new Date(x[0]+"-15T12:00").toLocaleDateString(undefined,{month:"short"})} ${x[1]}`).join(" → ")} cases. Peak in ${mlabel(peak[0])}, mostly from ${esc(topMal)}.</span></div>`:""}
    <div class="grid g2">
     <div class="panel"><h3>Conditions treated</h3><div class="bars">${dxs.map(([c,n])=>`<div class="b"><span>${DX[c].name}</span><div class="tr"><div class="fl" style="width:${n/maxD*100}%"></div></div><b>${n}</b></div>`).join("")||'<p class="empty">No visits</p>'}</div></div>
     <div class="panel"><h3>Medicines used most</h3><div class="bars blue">${drs.map(([d,q])=>`<div class="b"><span>${esc(DR(d).name)}</span><div class="tr"><div class="fl" style="width:${q/maxR*100}%"></div></div><b>${q}</b></div>`).join("")||'<p class="empty">None</p>'}</div></div>
    </div>`;
  }
  if(ui.insTab==="time"){
    const stageAvg=STAGES.slice(0,-1).map((s,i)=>{const n=STAGES[i+1];const v=done.map(e=>mins(e.times[s],e.times[n]));return[s,Math.round(v.reduce((a,b)=>a+b,0)/Math.max(1,v.length))]});
    const maxS=Math.max(...stageAvg.map(x=>x[1]),1), total=stageAvg.reduce((a,x)=>a+x[1],0);
    const docs=S.staff.filter(s=>s.role==="Doctor").map(d=>{const dv=done.filter(e=>e.doctor===d.id);return{d,n:dv.length,m:dv.reduce((a,e)=>a+e.consult,0)}});
    const days=[...new Set(S.encs.filter(e=>e.stage==="Done").map(e=>e.day))].sort();
    let best=null;days.forEach(d=>{const end=addDays(d,2);const vs=S.encs.filter(e=>e.stage==="Done"&&e.day>=d&&e.day<=end);if(!best||vs.length>best.vs.length)best={d,end,vs}});
    return head+`<div class="kpis"><div class="kpi"><b>${total}m</b><span>Average visit, in to out</span></div><div class="kpi"><b>${stageAvg.slice().sort((a,b)=>b[1]-a[1])[0][0]}</b><span>Longest wait</span></div><div class="kpi"><b>${done.length}</b><span>Completed visits</span></div></div>
    <div class="grid g2"><div class="panel"><h3>Average minutes at each stage</h3><div class="bars amber">${stageAvg.map(([s,m])=>`<div class="b"><span>${s}</span><div class="tr"><div class="fl" style="width:${m/maxS*100}%"></div></div><b>${m}m</b></div>`).join("")}</div></div>
     <div class="panel"><h3>Doctor time</h3><table><thead><tr><th>Doctor</th><th class="n">Patients</th><th class="n">Total</th><th class="n">Each</th></tr></thead><tbody>
     ${docs.map(x=>`<tr><td>${esc(x.d.name)}</td><td class="n">${x.n}</td><td class="n">${Math.floor(x.m/60)}h ${x.m%60}m</td><td class="n">${x.n?Math.round(x.m/x.n):0}m</td></tr>`).join("")}</tbody></table></div></div>
    ${best?`<div class="panel wrap" style="margin-top:1rem"><h3>Busiest three days: ${dshort(best.d)} – ${dfmt(best.end)} · ${best.vs.length} patients</h3><table><thead><tr><th>Date</th><th>Patient</th><th>In</th><th>Out</th><th>Medicines given</th></tr></thead><tbody>
     ${best.vs.sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<tr class="click" data-chart="${e.id}" tabindex="0"><td class="mono small">${dshort(e.day)}</td><td>${esc(PT(e.pid).name)}</td><td class="mono small">${hm(e.times.Reception)}</td><td class="mono small">${hm(e.times.Done)}</td><td class="small">${esc(e.rx.map(r=>DR(r.drug).name).join(", "))}</td></tr>`).join("")}</tbody></table></div>`:""}`;
  }
  const ms=months().filter(m=>S.payroll.some(p=>p.month===m)||S.encs.some(e=>e.day.startsWith(m)&&e.paid));
  const P=ms.map(pnl), sel=ui.month==="all"?P:P.filter(x=>x.m===ui.month);
  const rev=sel.reduce((a,x)=>a+x.revenue,0);
  const inSel=d=>ui.month==="all"?ms.some(m=>d.startsWith(m)):d.startsWith(ui.month);
  const spend=[["Payroll",sel.reduce((a,x)=>a+x.pay,0)],["Medicine purchases",S.pos.filter(p=>p.vendor!=="V3"&&inSel(p.date)).reduce((a,p)=>a+p.total,0)],["Lab supplies",S.pos.filter(p=>p.vendor==="V3"&&inSel(p.date)).reduce((a,p)=>a+p.total,0)],["Rent and utilities",sel.reduce((a,x)=>a+x.other,0)]];
  const spent=spend.reduce((a,x)=>a+x[1],0), maxSp=Math.max(1,...spend.map(x=>x[1]));
  const totalV=P.reduce((a,x)=>a+x.visits,0)||1;
  const perRev=P.reduce((a,x)=>a+x.revenue,0)/totalV, perVar=P.reduce((a,x)=>a+x.drugCost+x.labCost,0)/totalV;
  const fm=P.filter(x=>x.pay>0);const fixed=fm.reduce((a,x)=>a+x.pay+x.other,0)/Math.max(1,fm.length);
  const be=Math.ceil(fixed/Math.max(1,perRev-perVar));
  const W=560,H=210,pd=32,max=Math.max(1,...P.map(x=>Math.max(x.revenue,x.costs)))*1.12,gw=(W-pd*2)/Math.max(1,P.length);
  const bars=P.map((x,i)=>{const x0=pd+i*gw+gw*.18,bw=gw*.3,h1=x.revenue/max*(H-pd*2),h2=x.costs/max*(H-pd*2);
    return `<rect x="${x0}" y="${H-pd-h1}" width="${bw}" height="${h1}" rx="2" fill="var(--accent)"/><rect x="${x0+bw+4}" y="${H-pd-h2}" width="${bw}" height="${h2}" rx="2" fill="var(--blue)" opacity=".8"/><text x="${x0+bw}" y="${H-pd+16}" text-anchor="middle">${new Date(x.m+"-15T12:00").toLocaleDateString(undefined,{month:"short"})}</text>`}).join("");
  return head+`<div class="kpis"><div class="kpi"><b>${money0(rev)}</b><span>Income</span></div><div class="kpi"><b>${money0(spent)}</b><span>Money spent</span></div><div class="kpi"><b style="color:${rev-spent>=0?"var(--accent)":"var(--red)"}">${money0(rev-spent)}</b><span>Difference</span></div></div>
  <div class="grid g2">
   <div class="panel"><h3>Where the money went</h3><div class="bars blue">${spend.map(([l,v])=>`<div class="b"><span>${l}</span><div class="tr"><div class="fl" style="width:${v/maxSp*100}%"></div></div><b>${money0(v)}</b></div>`).join("")}</div></div>
   <div class="panel"><h3>Break-even</h3><p style="margin:0"><span class="big">${be}</span> <span class="muted">visits a month</span></p>
    <p class="muted small">Each visit earns about ${money(perRev)} and uses ${money(perVar)} in medicines and lab supplies. Fixed costs average ${money0(fixed)} a month.</p>
    <div class="note">The demo has about ${Math.round(totalV/Math.max(1,P.length))} visits a month, so it shows a loss. Real patient numbers will replace this.</div></div>
  </div>
  <div class="panel" style="margin-top:1rem"><h3>Income and costs by month</h3><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Income and costs by month">${bars}<line x1="${pd}" x2="${W-pd}" y1="${H-pd}" y2="${H-pd}" stroke="var(--line)"/></svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>Income</span><span><i style="background:var(--blue)"></i>Costs</span></div></div>`;
},
};

/* ================= behaviour ================= */
function advance(id){
  const e=EN(id), i=STAGES.indexOf(e.stage); if(i>=STAGES.length-1)return;
  const next=STAGES[i+1];
  if(next==="Done"&&!e.paid){toast("Take payment or claim before checking out");openEnc=id;go("chart");return}
  e.stage=next;e.times[next]=nowISO();
  if(next==="Pharmacy"&&e.times.Doctor)e.consult=mins(e.times.Doctor,e.times.Pharmacy);
  save();toast(`${PT(e.pid).name} moved to ${next}`);render();
}
function dispense(id){
  const e=EN(id);let short=null;
  e.rx.filter(r=>!r.dispensed).forEach(r=>{if(DR(r.drug).stock<r.qty)short=DR(r.drug).name});
  if(short){toast(`Not enough ${short} in stock`);return}
  e.rx.filter(r=>!r.dispensed).forEach(r=>{const d=DR(r.drug);d.stock-=r.qty;r.dispensed=true;S.moves.push({id:uid(),date:nowISO(),drug:d.id,qty:-r.qty,why:"Dispensed "+e.id})});
  save();toast("Dispensed. Stock and accounts updated");render();
}
const val=id=>document.getElementById(id).value.trim();
function readChart(e){
  const has=id=>document.getElementById(id), g=id=>document.getElementById(id).value.trim();
  if(has("bp")){e.vitals={bp:g("bp"),pulse:g("pulse"),temp:g("temp"),weight:g("wt")};e.complaint=g("cc");e.nurse=g("nurse")}
  if(has("notes")){e.notes=g("notes");e.rec=g("rec");e.doctor=g("doc");e.dx=[...document.querySelectorAll(".dx:checked")].map(i=>i.value)}
  document.querySelectorAll("[data-lr]").forEach(i=>{const l=e.labs[+i.dataset.lr];l.result=i.value;l.done=!!i.value});
  document.querySelectorAll("[data-lf]").forEach(i=>e.labs[+i.dataset.lf].flag=i.value);
  if(has("nd")){const nd=g("nd");e.next=nd?{date:nd,time:g("nt")||"09:00",reason:g("nr")||"Review"}:null}
}
function bindCommon(){
  document.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>{if(current()==="chart")readChart(EN(b.dataset.next));advance(b.dataset.next)});
  document.querySelectorAll("[data-disp]").forEach(b=>b.onclick=()=>dispense(b.dataset.disp));
}
function scanAnim(cb){const fp=document.getElementById("fp");fp.classList.remove("done");fp.classList.add("on");
  setTimeout(()=>{fp.classList.remove("on");fp.classList.add("done");cb()},window.matchMedia("(prefers-reduced-motion: reduce)").matches?100:2200)}
function newEnc(p){return {id:"E"+(7001+S.encs.length),pid:p.id,day:todayStr(),date:nowISO(),stage:"Reception",times:{Reception:nowISO()},doctor:"S1",nurse:"S3",consult:0,vitals:{},complaint:"",labs:[],notes:"",dx:[],rec:"",rx:[],next:null,referral:null,paid:false,payer:p.aid,claim:"Pending"}}
function checkIn(p){
  const out=document.getElementById("scanOut");
  const open=S.encs.find(e=>e.pid===p.id&&e.day===todayStr()&&e.stage!=="Done");
  out.innerHTML=`<div class="note" style="margin-top:.8rem"><b>${esc(p.name)}</b> <span class="mono small">${p.id} · ${esc(p.nid)}</span><br><span class="small">${esc(p.province)} · ${esc(p.aid)} · ${S.encs.filter(e=>e.pid===p.id).length} visits on record</span>
  <div class="actions">${open?`<span class="tag warn">Already in clinic at ${open.stage}</span>`:`<button class="btn s" id="ciBtn">Start today’s visit</button>`}</div></div>`;
  const b=document.getElementById("ciBtn");
  if(b)b.onclick=()=>{S.encs.push(newEnc(p));save();toast(`${p.name} checked in`);render()};
}
function newPatientForm(){
  document.getElementById("scanOut").innerHTML=`<div class="note" style="margin-top:.8rem"><b>No match. Register a new patient</b> <span class="small muted">Fingerprint captured</span>
  <div class="row r2"><div><label class="f" for="nN">Full name</label><input type="text" id="nN"></div><div><label class="f" for="nI">National ID</label><input type="text" id="nI" placeholder="63-123456A75"></div>
  <div><label class="f" for="nA">Age</label><input type="number" id="nA" value="40"></div><div><label class="f" for="nP">Phone</label><input type="text" id="nP" placeholder="+263 77 ..."></div>
  <div><label class="f" for="nV">Province</label><select id="nV">${PROVINCES.map(p=>`<option>${p}</option>`).join("")}</select></div><div><label class="f" for="nM">Payment</label><select id="nM">${PAYERS.map(a=>`<option>${a}</option>`).join("")}</select></div></div>
  <label class="small" style="display:flex;gap:.5rem;margin-top:.8rem"><input type="checkbox" id="nC"> Patient consents to their record being stored and shared with their doctors</label>
  <div class="actions"><button class="btn s" id="regBtn">Register and check in</button></div></div>`;
  document.getElementById("regBtn").onclick=()=>{const n=val("nN");if(!n){toast("Enter the patient’s name");return}
    if(!document.getElementById("nC").checked){toast("The patient’s consent is needed to register");return}
    const p={id:"P"+(1001+S.patients.length),name:n,nid:val("nI")||"Not captured",age:+val("nA")||0,phone:val("nP"),province:val("nV"),aid:val("nM"),consent:true};
    S.patients.push(p);S.encs.push(newEnc(p));save();toast(`${n} registered and checked in`);render()};
}
const B={
 queue(){bindCommon();
  document.getElementById("ciToggle").onclick=()=>{ui.showCheckin=!ui.showCheckin;render()};
  const sb=document.getElementById("scanBtn");
  if(sb){sb.onclick=()=>{const w=val("who");scanAnim(()=>w==="new"?newPatientForm():checkIn(PT(w)))};

/* ================= finance: helpers ================= */
const monthEnd=m=>{const[y,mo]=m.split("-").map(Number);return y+"-"+pad2(mo)+"-"+pad2(new Date(y,mo,0).getDate())};
const prevMonth=m=>{const[y,mo]=m.split("-").map(Number);const d=new Date(y,mo-2,15);return d.getFullYear()+"-"+pad2(d.getMonth()+1)};
const mshort=m=>new Date(m+"-15T12:00").toLocaleDateString(undefined,{month:"short",year:"2-digit"});
const AIDS=()=>PAYERS.filter(a=>a!=="Cash");
function acctMonths(){return [...new Set([...S.encs.map(e=>e.day.slice(0,7)),...S.payroll.map(p=>p.month)])].sort().filter(m=>S.payroll.some(p=>p.month===m)||S.encs.some(e=>e.day.startsWith(m)&&e.paid))}
function curAM(){const ms=acctMonths();if(!ms.includes(ui.am))ui.am=ms[ms.length-1];return ui.am}
function monthBar(){const ms=acctMonths(),m=curAM(),i=ms.indexOf(m);
  return `<div class="monthbar"><button class="btn g s" data-am="${ms[i-1]||""}" ${i>0?"":"disabled"} aria-label="Previous month">‹</button><select class="month" id="amSel" aria-label="Month">${ms.map(x=>`<option value="${x}" ${x===m?"selected":""}>${mlabel(x)}</option>`).join("")}</select><button class="btn g s" data-am="${ms[i+1]||""}" ${i<ms.length-1?"":"disabled"} aria-label="Next month">›</button></div>`}
function depFor(m){return S.assets.filter(a=>a.date.slice(0,7)<=m).reduce((x,a)=>x+a.cost/a.life,0)}
function pnl(m){
  const vs=S.encs.filter(e=>e.paid&&e.day.startsWith(m));
  const r={m,visits:vs.length,consult:0,lab:0,pharm:0,drugCost:0,labCost:0,cats:{}};
  vs.forEach(e=>{billOf(e).forEach(i=>r[i.k]+=i.a);e.rx.forEach(x=>r.drugCost+=x.qty*DR(x.drug).cost);e.labs.forEach(l=>r.labCost+=(LABS[l.test]||{cost:0}).cost)});
  r.pay=payrollFor(m).reduce((a,l)=>a+l.gross,0);
  EXP_CATS.forEach(c=>r.cats[c]=S.invoices.filter(i=>i.cat===c&&i.date.startsWith(m)).reduce((a,i)=>a+i.amount,0));
  r.dep=depFor(m);
  r.other=Object.values(r.cats).reduce((a,b)=>a+b,0)+r.dep;
  r.revenue=r.consult+r.lab+r.pharm;r.costs=r.drugCost+r.labCost+r.pay+r.other;r.profit=r.revenue-r.costs;
  return r;
}
function stmt(tx,m){const start=m+"-01",end=monthEnd(m);const open=tx.filter(t=>t.date<start).reduce((a,t)=>a+t.dr-t.cr,0);
  let bal=open;const rows=tx.filter(t=>t.date>=start&&t.date<=end).map(t=>{bal+=t.dr-t.cr;return{...t,bal}});
  return{open,rows,close:bal,dr:rows.reduce((a,t)=>a+t.dr,0),cr:rows.reduce((a,t)=>a+t.cr,0)}}
function debtorTx(aid){const t=[];
  S.encs.filter(e=>e.paid&&e.payer===aid).forEach(e=>t.push({date:e.day,ref:"CLM-"+e.id.slice(1),desc:PT(e.pid).name+" · "+(e.dx.map(c=>DX[c].name).join(", ")||"Visit"),dr:billTotal(e),cr:0}));
  S.receipts.filter(r=>r.aid===aid).forEach(r=>t.push({date:r.date,ref:r.id,desc:"Payment received",dr:0,cr:r.amount}));
  return t.sort((a,b)=>a.date.localeCompare(b.date)||b.dr-a.dr)}
function aging(aid,m){const end=monthEnd(m),b=[0,0,0,0];
  S.encs.filter(e=>e.paid&&e.payer===aid&&e.day<=end&&(!e.claimPaidOn||e.claimPaidOn>end)).forEach(e=>{const d=(new Date(end)-new Date(e.day))/864e5;b[d<=30?0:d<=60?1:d<=90?2:3]+=billTotal(e)});return b}
function creditorTx(v){const t=[];
  S.invoices.filter(i=>i.vendor===v).forEach(i=>t.push({date:i.date,ref:i.id,desc:i.desc||i.cat,dr:i.amount,cr:0,due:i.due}));
  S.payments.filter(p=>p.vendor===v).forEach(p=>t.push({date:p.date,ref:p.id,desc:"Payment · "+p.invoice,dr:0,cr:p.amount}));
  return t.sort((a,b)=>a.date.localeCompare(b.date)||b.dr-a.dr)}
const paidOn=inv=>S.payments.find(p=>p.invoice===inv.id)?.date;
function overdueAt(v,m){const end=monthEnd(m);return S.invoices.filter(i=>i.vendor===v&&i.due<end&&i.date<=end&&!(paidOn(i)&&paidOn(i)<=end)).reduce((a,i)=>a+i.amount,0)}
function statutory(m){const L=payrollFor(m);return{nssa:L.reduce((a,l)=>a+l.nssa,0),paye:L.reduce((a,l)=>a+l.paye,0),levy:L.reduce((a,l)=>a+l.levy,0)}}
function outflows(m){
  const rows=S.payments.filter(p=>p.date.startsWith(m)).map(p=>{const i=S.invoices.find(x=>x.id===p.invoice);return{date:p.date,to:VN(p.vendor).name,what:(i?.desc||i?.cat||"")+" · "+p.invoice,cat:i?.cat||"Other",amt:p.amount}});
  if(S.payroll.some(p=>p.month===m))rows.push({date:m+"-25",to:"Staff",what:"Net salaries, "+mlabel(m),cat:"Payroll",amt:payrollFor(m).reduce((a,l)=>a+l.net,0)});
  const pm=prevMonth(m);if(S.payroll.some(p=>p.month===pm)){const st=statutory(pm);rows.push({date:m+"-10",to:"NSSA",what:"Contributions, "+mlabel(pm),cat:"Payroll",amt:st.nssa});rows.push({date:m+"-10",to:"ZIMRA",what:"PAYE and AIDS levy, "+mlabel(pm),cat:"Payroll",amt:st.paye+st.levy})}
  return rows.filter(r=>r.date<=todayStr()).sort((a,b)=>a.date.localeCompare(b.date));
}
function inflows(m){
  const cash=S.encs.filter(e=>e.paid&&e.payer==="Cash"&&e.day.startsWith(m)).reduce((a,e)=>a+billTotal(e),0);
  const aid=S.receipts.filter(r=>r.date.startsWith(m)).reduce((a,r)=>a+r.amount,0);
  return{cash,aid,total:cash+aid};
}
function barsSVG(P,keys,colors,labelFn){
  const W=560,H=210,pd=32,max=Math.max(1,...P.map(x=>keys.reduce((a,k)=>a+x[k],0)))*1.12,gw=(W-pd*2)/Math.max(1,P.length);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly chart">${P.map((x,i)=>{let y=H-pd;const x0=pd+i*gw+gw*.25,bw=gw*.5;
    return keys.map((k,j)=>{const h=x[k]/max*(H-pd*2);y-=h;return `<rect x="${x0}" y="${y}" width="${bw}" height="${h}" fill="${colors[j]}"${j===keys.length-1?' rx="2"':""}/>`}).join("")+
    `<text x="${x0+bw/2}" y="${H-pd+16}" text-anchor="middle">${labelFn(x)}</text><text x="${x0+bw/2}" y="${y-6}" text-anchor="middle" style="fill:var(--ink)">${money0(keys.reduce((a,k)=>a+x[k],0))}</text>`}).join("")}<line x1="${pd}" x2="${W-pd}" y1="${H-pd}" y2="${H-pd}" stroke="var(--line)"/></svg>`;
}

function pairChart(P){

    return `<rect x="${x0}" y="${H-pd-h1}" width="${bw}" height="${h1}" rx="2" fill="var(--accent)"/><rect x="${x0+bw+4}" y="${H-pd-h2}" width="${bw}" height="${h2}" rx="2" fill="var(--blue)" opacity=".8"/><text x="${x0+bw}" y="${H-pd+16}" text-anchor="middle">${mshort(x.m)}</text>`}).join("")}<line x1="${pd}" x2="${W-pd}" y1="${H-pd}" y2="${H-pd}" stroke="var(--line)"/></svg>`;
}

function impactView(){
  const b=S.baseline, done=S.encs.filter(e=>e.stage==="Done");
  const byM=months().map(m=>{const v=done.filter(e=>e.day.startsWith(m));return{m,n:v.length,avg:v.length?Math.round(v.reduce((a,e)=>a+mins(e.times.Reception,e.times.Done),0)/v.length):null}}).filter(x=>x.n);
  const nowAvg=byM.length?byM[byM.length-1].avg:0;
  const paidClaims=S.encs.filter(e=>e.claimPaidOn);const turn=paidClaims.length?Math.round(paidClaims.reduce((a,e)=>a+(new Date(e.claimPaidOn)-new Date(e.day))/864e5,0)/paidClaims.length):0;
  const ref=refDay(), ap=S.encs.filter(e=>e.next&&e.next.date<=ref).map(e=>S.encs.some(x=>x.pid===e.pid&&x.day>e.day&&Math.abs((new Date(x.day)-new Date(e.next.date))/864e5)<=10));
  const attend=ap.length?Math.round(ap.filter(Boolean).length/ap.length*100):0;
  const returning=done.filter(e=>S.encs.some(x=>x.pid===e.pid&&x.day<e.day)).length;
  const refs=S.encs.filter(e=>e.referral).length;
  const disp={},billed={};S.moves.filter(m=>m.qty<0).forEach(m=>disp[m.drug]=(disp[m.drug]||0)-m.qty);S.encs.forEach(e=>e.rx.filter(r=>r.dispensed).forEach(r=>billed[r.drug]=(billed[r.drug]||0)+r.qty));
  const off=S.drugs.filter(d=>(disp[d.id]||0)!==(billed[d.id]||0)).length;
  const app=Math.round(new Set(S.appUsers).size/S.patients.length*100);
  const saved=Math.max(0,Math.round((b.visitMin-nowAvg)*done.length/60));
  const card=(ic,t,before,now,good,how)=>`<div class="impact">${icon(ic,34)}<b>${t}</b><div class="ba"><div><span>Before</span><em>${before}</em></div><span class="arr">→</span><div><span>Now</span><em style="color:${good?"var(--accent)":"var(--amber)"}">${now}</em></div></div><p>${how}</p></div>`;
  const W=560,H=170,pd=30,max=Math.max(b.visitMin,...byM.map(x=>x.avg))*1.1;
  const X=i=>pd+i*((W-pd*2)/Math.max(1,byM.length-1)),Y=v=>H-pd-v/max*(H-pd*2);
  return `<div class="callout"><b>How we track impact.</b> <span class="muted">Record a “before Hutano” baseline once (from a week of paper records or a staff estimate). Hutano then measures the same things automatically every month, so the change is visible and can be shown to investors and the Ministry.</span></div>
  <div class="impacts">
   ${card("flow","Time in the clinic",`${b.visitMin} min`,`${nowAvg} min`,nowAvg<b.visitMin,"Average from fingerprint sign-in to check-out, measured on every visit.")}
   ${card("chart","Records found at the next visit",`${b.recordsFound}%`,"100%",true,`${returning} returning visits opened the full history instantly. On paper, books get lost.`)}
   ${card("coin","Days to get paid by medical aids",`${b.claimDays} days`,`${turn} days`,turn<b.claimDays,"From the visit date to the date the medical aid’s payment was recorded.")}
   ${card("calendar","Follow-up visits attended",`${b.attend}%`,`${attend}%`,attend>b.attend,"Share of booked follow-ups the patient came back for. Reminders go to the patient’s app and calendar.")}
   ${card("pill","Medicines given but not billed",b.leak,`${off}`,off===0,"Dispensing and billing are one action, so every tablet that leaves is charged.")}
   ${card("users","Patients using the app",`0%`,`${app}%`,true,"Patients who have signed in at least once to see results, pay or message their doctor.")}
  </div>
  <div class="grid g2" style="margin-top:1rem">
   <div class="panel"><h3>Time in clinic by month</h3><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Average minutes in clinic by month"><line x1="${pd}" x2="${W-pd}" y1="${Y(b.visitMin)}" y2="${Y(b.visitMin)}" stroke="var(--amber)" stroke-dasharray="5 4"/><text x="${W-pd}" y="${Y(b.visitMin)-6}" text-anchor="end" style="fill:var(--amber)">Paper baseline ${b.visitMin}m</text>
    <polyline points="${byM.map((x,i)=>X(i)+","+Y(x.avg)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>${byM.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.avg)}" r="4" fill="var(--accent)"/><text x="${X(i)}" y="${Y(x.avg)-9}" text-anchor="middle" style="fill:var(--ink)">${x.avg}m</text><text x="${X(i)}" y="${H-pd+16}" text-anchor="middle">${mshort(x.m)}</text>`).join("")}</svg>
    <p class="muted small" style="margin:.4rem 0 0">About <b style="color:var(--accent)">${saved} patient-hours</b> saved so far compared with the paper baseline. ${refs} referrals were sent electronically, so no patient had to carry papers.</p></div>
   <div class="panel"><h3>Your “before Hutano” baseline</h3><p class="muted small" style="margin-top:0">Change these to match what the clinic measured before going digital.</p>
    <div class="row r2"><div><label class="f" for="bVisit">Minutes in clinic</label><input type="number" id="bVisit" value="${b.visitMin}"></div><div><label class="f" for="bClaim">Days to get paid</label><input type="number" id="bClaim" value="${b.claimDays}"></div>
    <div><label class="f" for="bRec">Records found (%)</label><input type="number" id="bRec" value="${b.recordsFound}"></div><div><label class="f" for="bAtt">Follow-ups attended (%)</label><input type="number" id="bAtt" value="${b.attend}"></div></div>
    <div class="actions"><button class="btn g s" id="bSave">Save baseline</button></div></div></div>`;
}

function showStep(){
  const st=TOURS[TOUR.name][TOUR.i];st.setup&&st.setup();
  if(mode!==st.mode)mode=st.mode;

  const r=el?el.getBoundingClientRect():null, pad=8;
  const spot=r?`<div class="spot" style="top:${r.top-pad}px;left:${r.left-pad}px;width:${r.width+pad*2}px;height:${Math.min(r.height+pad*2,window.innerHeight-40)}px"></div>`:`<div class="spot none"></div>`;
  const W=Math.min(360,window.innerWidth-24), mobile=window.innerWidth<640;
  let top,left,arrow="";

    if(window.innerHeight-below>230){top=below;arrow="up"}else if(above>230){top=above-210;arrow="down"}else{top=Math.max(16,window.innerHeight/2-110)}
    left=Math.min(Math.max(12,r.left+Math.min(r.width,200)/2-40),window.innerWidth-W-12)}
  const ax=r?Math.min(Math.max(20,r.left+Math.min(r.width,200)/2-left),W-30):0;
  root.innerHTML=`${spot}<div class="tcard ${mobile?"mobile":""}" role="dialog" aria-label="Guide" style="${mobile?"":`top:${top}px;left:${left}px;width:${W}px`}">${arrow&&!mobile?`<i class="tarrow ${arrow}" style="left:${ax}px"></i>`:""}
    <div class="tart">${icon(st.ic,56)}</div><div class="tstep">Step ${TOUR.i+1} of ${steps.length}</div><h3>${st.t}</h3><p>${st.b}</p>

    <div class="actions"><button class="link" id="tSkip" style="color:var(--muted)">Skip tour</button><span style="flex:1"></span>${TOUR.i>0?'<button class="btn g s" id="tBack">Back</button>':""}<button class="btn s" id="tNext">${TOUR.i===steps.length-1?"Finish":"Next ›"}</button></div></div>`;

}
